name: strongR-frida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const releaseResponse = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            })
            const {
              data: { tag_name: ver }
            } = releaseResponse;
            core.setOutput('FRIDA_VERSION', ver);
      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'
              const releaseResponse = await github.rest.repos.getReleaseByTag({
                owner: '${{ secrets.GIT_OWNER }}',
                repo: '${{ secrets.GIT_REPO }}',
                tag: releaseVersion
              });
              const {
                data: { tag_name: ver }
              } = releaseResponse;
              if (ver == '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'){
                  core.setOutput('ALREADY_RELEASE', '1');
              }
              else{
                  core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if(e.status == 404){
                core.setOutput('ALREADY_RELEASE', '0');
              }
              else{
                core.setFailed(e.message);
              }
            }


  create_release:
    needs: check_version
    runs-on: ubuntu-latest
    if: needs.check_version.outputs.ALREADY_RELEASE == '0'

    steps:
      - name: Create Runner Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]
    strategy:
      matrix:
        include:
          - arch: x86
            bits: 32
          - arch: x86_64
            bits: 64
          - arch: arm
            bits: 32
          - arch: arm64
            bits: 64
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: fusion-engineering/setup-git-credentials@v2
      with:
        credentials: ${{secrets.GIT_CREDENTIALS}}

    - name: set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "8"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief

    - name: Persist Android NDK path
      shell: bash
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: build frida for Android
      shell: bash
      run: |
        git config --global user.name "gitAction"
        git config --global user.email "gitAction@gmail.com"
        git clone ${{ secrets.PATCH_REPO }}
        git clone --recurse-submodules https://github.com/frida/frida
        cd frida/subprojects/frida-core
        git am ../../../Patchs/strongR-frida/frida-core/*.patch

    - name: two step patch
      shell: bash
      run: |
        cd frida/subprojects/frida-gum/gum
        git am ../../../../Patchs/strongR-frida/frida-gum/*.patch

    - name: Configure
      shell: bash
      run: |
          cd frida
          ./configure --host=android-${{ matrix.arch }} --enable-portal -- -Dfrida-gum:devkits=gum,gumjs -Dfrida-core:devkits=core

    - name: Compile
      run: |
        cd frida
        make

    - name: Check release version
      id: checkReleaseVersion
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const releaseVersion = '${{ needs.check_version.outputs.FRIDA_VERSION }}'
            const releaseResponse = await github.rest.repos.getReleaseByTag({
              owner: '${{ secrets.GIT_OWNER }}',
              repo: '${{ secrets.GIT_REPO }}',
              tag: releaseVersion
            })
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = releaseResponse;
            core.setOutput('id', releaseId);
            core.setOutput('html_url', htmlUrl);
            core.setOutput('upload_url', uploadUrl);
            core.setOutput('version', releaseVersion);
          } catch (e) {
            core.setFailed(e.message);
          }

    - name: package build result for Android
      shell: bash
      run: |
        pushd frida
        xz build/frida-android-${{ matrix.arch }}/bin/frida-server
        xz build/frida-android-${{ matrix.arch }}/bin/frida-inject
        xz build/frida-android-${{ matrix.arch }}/lib/frida/${{ matrix.bits }}/frida-gadget.so
        popd

        mkdir -p release-assets
        cp frida/build/frida-android-${{ matrix.arch }}/bin/frida-server.xz \
          "release-assets/hluda-server-${{ needs.check_version.outputs.FRIDA_VERSION }}-android-${{ matrix.arch }}.xz"
        cp frida/build/frida-android-${{ matrix.arch }}/bin/frida-inject.xz \
          "release-assets/hluda-inject-${{ needs.check_version.outputs.FRIDA_VERSION }}-android-${{ matrix.arch }}.xz"
        cp frida/build/frida-android-${{ matrix.arch }}/lib/frida/${{ matrix.bits }}/frida-gadget.so.xz \
          "release-assets/hluda-gadget-${{ needs.check_version.outputs.FRIDA_VERSION }}-android-${{ matrix.arch }}.so.xz"

    - name: Upload Android artifacts for strongR-frida
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
        files: release-assets/*
